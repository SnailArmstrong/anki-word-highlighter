<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anki Extension Advanced Settings</title>
  <style>
    body {
      padding: 24px;
      max-width: 500px;
      margin: 0 auto;
      background-color: #121214;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e4e4e7;
    }
    h2 { color: #60a5fa; font-size: 20px; margin-bottom: 4px; }
    .subtitle { color: #a1a1aa; font-size: 13px; margin-bottom: 20px; }
    .box {
      background: #18181b;
      border: 1px solid #27272a;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .row:last-child { margin-bottom: 0; }
    select, input[type="file"] {
      width: 55%;
      padding: 8px;
      font-size: 14px;
      background-color: #27272a;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      box-sizing: border-box;
    }
    select:focus, input[type="file"]:focus {
      outline: none;
      border-color: #60a5fa;
    }
    button {
      width: 100%;
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }
    #saveDeckBtn { background-color: #3f3f46; }
    #saveDeckBtn:hover:not(:disabled) { background-color: #52525b; }

    #importDictBtn { background-color: #3f3f46; }
    #importDictBtn:hover:not(:disabled) { background-color: #52525b; }

    #clearDataBtn { background-color: #dc2626; margin-top: 20px; }
    #clearDataBtn:hover { background-color: #b91c1c; }

    button:disabled {
      background-color: #27272a !important;
      cursor: not-allowed;
      color: #71717a !important;
      opacity: 0.7;
    }
    
    #status {
      font-weight: bold;
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
    }
    .status-msg.info { color: #38bdf8; }
    .status-msg.success { color: #4ade80; }
    .status-msg.error { color: #f87171; }

    #statsInfo {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #4ade80;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h2>Anki Spanish Sync</h2>
  <div class="subtitle">Advanced Configuration Page</div>

  <!-- Anki Deck Settings -->
  <div class="box">
    <div class="row">
      <span>Target Deck</span>
      <select id="deckSelect"><option value="">Connecting...</option></select>
    </div>
    <div class="row">
      <span>Target Field</span>
      <select id="fieldSelect"><option value="">Select Deck First</option></select>
    </div>
    <button id="saveDeckBtn">Save Anki Deck Settings & Sync</button>
  </div>

  <!-- Yomitan Dictionary Import -->
  <div class="box">
    <div class="row">
      <span>Yomitan Dict (.zip)</span>
      <input type="file" id="dictInput" accept=".zip,.json" multiple>
    </div>
    <button id="importDictBtn">Import & Save Dictionary</button>
  </div>

  <!-- Suspended Card Handling -->
  <div class="box">
    <div class="row">
      <span>Use Suspended Override</span>
      <input type="checkbox" id="suspendedOverrideToggle" style="width: auto; height: 20px;">
    </div>
    <div class="row">
      <span>Treat Suspended As</span>
      <select id="suspendedOverrideStatus" disabled>
        <option value="mature">Mature</option>
        <option value="learning">Learning</option>
        <option value="ignore">Ignore (don't highlight)</option>
      </select>
    </div>
  </div>

  <!-- Reset Option -->
  <button id="clearDataBtn">Clear All Extension Data</button>

  <div id="status" class="status-msg info">Ready</div>
  <div id="statsInfo"></div>

  <script src="jszip_min.js"></script>
  <script src="options.js"></script>
</body>
</html>
