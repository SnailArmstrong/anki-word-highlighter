services:
  web:
    image: ghcr.io/cirruslabs/flutter:latest
    working_dir: /app/flutter_app
    volumes:
      - ./:/app
    command: sh -c "flutter pub get && flutter build web --release && sed -i 's/_flutter.buildConfig = {\"/_flutter.buildConfig = {\"useLocalCanvasKit\":true,\"/' build/web/flutter_bootstrap.js && echo '<!DOCTYPE html><html><head><meta http-equiv=\"refresh\" content=\"0;url=/\"><title>Redirect</title></head><body></body></html>' > build/web/popup.html && dart pub global activate dhttpd && $HOME/.pub-cache/bin/dhttpd --path build/web --port 3000 --host 0.0.0.0"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
